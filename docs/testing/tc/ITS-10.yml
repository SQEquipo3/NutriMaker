id: ITS-10
level: ITS
module: exportacion
name: Verificar que PDFBuilder genere un archivo válido con los datos de la dieta
  recuperada desde MySQL.
objective: Verificar que PDFBuilder genere un archivo válido con los datos de la dieta
  recuperada desde MySQL.
pre: Dieta generada con comentario y 6 días con comidas; carpeta Documents del usuario
  disponible.
steps:
- Recuperar la dieta y su paciente con getDietObjectById
- Generar el PDF con PDFBuilder
- 'Revisar el archivo: tamaño, cabecera %PDF, páginas y texto.'
expected:
- La dieta trae paciente y 18 comidas; el PDF se crea sin error, pesa más de 0 bytes,
  tiene al menos una página y contiene el nombre del paciente, el comentario y las
  comidas.
reqs:
- RF-08
tests:
- ITS-10
