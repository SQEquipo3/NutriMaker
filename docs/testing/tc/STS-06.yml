id: STS-06
level: STS
module: dietas-almacenadas
name: Verificar el listado de dietas y la paginación.
objective: Verificar el listado de dietas y la paginación.
pre: Usuario con 25 dietas en nutrimaker_test.
steps:
- Iniciar sesión
- Revisar la primera página
- Pasar a las páginas 2 y 3
- Regresar a la página 2.
