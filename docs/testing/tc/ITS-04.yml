id: ITS-04
level: ITS
module: pacientes
name: Comprobar que RF-05 registra y recupera correctamente los datos del paciente.
objective: Comprobar que RF-05 registra y recupera correctamente los datos del paciente.
pre: MySQL de XAMPP disponible y nutrimaker_test con la tabla PACIENTE.
steps:
- Crear paciente con datos identificables
- Consultarlo por su ID
- Comparar nombre, edad, peso y altura con los valores originales.
expected:
- El paciente existe con ID positivo y sus datos persisten sin alteraciones.
reqs:
- RF-05
tests:
- ITS-04
