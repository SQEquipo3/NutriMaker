id: UTS-01
level: UTS
module: login
name: Verificar que la validación de correo del inicio de sesión acepte correos válidos
  y rechace los inválidos.
objective: Verificar que la validación de correo del inicio de sesión acepte correos
  válidos y rechace los inválidos.
pre: LoginController accesible desde la prueba, con el campo de correo simulado.
steps:
- Validar "nutri@correo.com" y "a.b+c@dominio.mx"
- Validar "sin_arroba.com", "a@", "@x.com" y "a b@x.com"
- Validar una cadena vacía
expected:
- Los correos válidos devuelven true; los inválidos y la cadena vacía devuelven false
reqs:
- RF-01
tests:
- UTS-01
