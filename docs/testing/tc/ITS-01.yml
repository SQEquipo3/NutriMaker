id: ITS-01
level: ITS
module: usuarios
name: Verificar que un usuario guardado en la base pueda autenticarse y que las credenciales
  incorrectas se rechacen.
objective: Verificar que un usuario guardado en la base pueda autenticarse y que las
  credenciales incorrectas se rechacen.
pre: Usuario sembrado en nutrimaker_test con su contraseña en hash BCrypt.
steps:
- Verificar la contraseña correcta del usuario
- Verificar una contraseña incorrecta
- Verificar un correo inexistente
expected:
- 'La contraseña correcta devuelve true; la incorrecta y el correo inexistente devuelven
  false sin lanzar excepción Comentarios: No verifica AES-128 ni TLS 1.2 (parte del
  RF-01); el código usa BCrypt.'
reqs:
- RF-01
tests:
- ITS-01
