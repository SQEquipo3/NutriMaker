id: ITS-02
level: ITS
module: usuarios
name: Verificar que el alta guarde el usuario en MySQL y que la contraseña no quede
  en texto plano.
objective: Verificar que el alta guarde el usuario en MySQL y que la contraseña no
  quede en texto plano.
pre: La tabla USUARIO no contiene el correo nuevo.
steps:
- Registrar un correo nuevo con la contraseña Abc12345
- Consultar la fila con SELECT
- Comparar la contraseña guardada con el texto plano
expected:
- El alta devuelve true; existe una fila con ese correo; la contraseña guardada es
  un hash BCrypt distinto del texto plano
reqs:
- RF-02
tests:
- ITS-02
