id: ATS-08
level: ATS
module: eliminar-dieta
name: Verificar que cancelar no borre la dieta.
objective: Verificar que cancelar no borre la dieta.
pre: Dado un usuario con una dieta existente.
steps:
- Cuando pulsa eliminar en la dieta
- Y pulsa Cancelar en la confirmación.
expected:
- Entonces el diálogo se cierra; y la dieta sigue en la lista y en la base de datos.
