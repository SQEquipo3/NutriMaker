id: ATS-04
level: ATS
module: crear-dieta
name: Un usuario puede generar una dieta personalizada
objective: Verificar que el nutriólogo obtenga una dieta completa con sus parámetros.
pre: Dado un paciente registrado.
steps:
- Cuando captura 2000 kcal, 4 comidas y un día de descanso, y crea la dieta.
- Y la consulta en su lista.
expected:
- Entonces recibe el aviso de dieta creada.
- Y la dieta tiene las 4 comidas por día, el día de descanso vacío y calorías acordes.
reqs:
- RF-04
tests: []
