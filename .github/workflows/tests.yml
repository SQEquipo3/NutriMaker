name: Tests

# Corre las pruebas en cada Pull Request y en main. githubMetrics lee el artefacto «test-reports»
# (jacoco.xml + Surefire) de las corridas en main, y «entregables-qa» trae los Excel del QA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# issues: read -> extraer_tc.py lee los bugs (label «bug») para la hoja «Bug report».
permissions:
  contents: read
  issues: read

jobs:
  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Base de pruebas para las ITS: las pruebas exigen la base nutrimaker_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nutrimaker_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      NUTRIMAKER_DB_USER: nutri_test
      NUTRIMAKER_DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"  # compila con release 23 del pom.xml
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema (pantalla virtual para JavaFX)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Preparar base nutrimaker_test
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE USER IF NOT EXISTS 'nutri_test'@'%' IDENTIFIED BY '';
            GRANT ALL PRIVILEGES ON nutrimaker_test.* TO 'nutri_test'@'%';"
          # Cuando el esquema esté en el repo (database/*.sql) se carga en orden
          for f in database/*.sql; do
            [ -f "$f" ] && mysql -h 127.0.0.1 -uroot -proot nutrimaker_test < "$f"
          done
          true

      # failure.ignore: si una prueba falla igual se generan JaCoCo y los Excel; el último paso
      # marca la corrida en rojo.
      - name: Pruebas con cobertura
        run: xvfb-run -a mvn -B verify -Dmaven.test.failure.ignore=true

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports  # debe coincidir con tests.artifact en githubMetrics/config/projects.yml
          path: |
            target/site/jacoco/jacoco.xml
            target/surefire-reports/*.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Generar SW Test Plan, TC Design y Test Report
        id: excel
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install openpyxl pyyaml matplotlib pillow
          python tools/extraer_tc.py
          python tools/generar_documentos.py

      - name: Publicar entregables (Excel + diagramas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entregables-qa
          path: entregables/
          if-no-files-found: warn

      - name: Revisar resultados
        run: |
          if grep -lE '<(failure|error)[ >]' target/surefire-reports/TEST-*.xml; then
            echo "::error::Hay pruebas fallidas (ver archivos arriba)"
            exit 1
          fi
