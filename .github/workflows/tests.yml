name: Tests

# Corre las pruebas en cada Pull Request y en main. githubMetrics lee el artefacto «test-reports»
# (jacoco.xml + Surefire) de las corridas en main, y «entregables-qa» trae los Excel del QA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# issues: read -> extraer_tc.py lee los bugs (label «bug») para la hoja «Bug report».
permissions:
  contents: read
  issues: read

jobs:
  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NUTRIMAKER_DB_USER: nutri_test
      NUTRIMAKER_DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"  # compila con release 23 del pom.xml
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema (pantalla virtual para JavaFX)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Base de pruebas para las ITS: las pruebas exigen la base nutrimaker_test.
      # MariaDB como en XAMPP; lower-case-table-names=1 porque el dump crea `usuario` y el
      # código consulta USUARIO (en Linux los nombres de tabla distinguen mayúsculas).
      - name: Preparar base nutrimaker_test
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=nutrimaker_test \
            mariadb:10.11 --lower-case-table-names=1
          for i in $(seq 1 30); do
            docker exec db mariadb -uroot -proot -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec db mariadb -uroot -proot -e "
            CREATE USER IF NOT EXISTS 'nutri_test'@'%' IDENTIFIED BY '';
            GRANT ALL PRIVILEGES ON nutrimaker_test.* TO 'nutri_test'@'%';"
          # El dump crea y usa la base nutrimaker; se carga en nutrimaker_test
          sed -E '/^CREATE DATABASE/,/;/d; /^USE /d' NutrimakerDB/nutrimaker.sql \
            | docker exec -i db mariadb -uroot -proot nutrimaker_test

      # failure.ignore: si una prueba falla igual se generan JaCoCo y los Excel; el último paso
      # marca la corrida en rojo.
      # Xvfb a 1920x1080: las ventanas miden 1728x972 y las pruebas STS/ATS hacen clic en ellas.
      - name: Pruebas con cobertura
        run: xvfb-run -a -s "-screen 0 1920x1080x24" mvn -B verify -Dmaven.test.failure.ignore=true

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports  # debe coincidir con tests.artifact en githubMetrics/config/projects.yml
          path: |
            target/site/jacoco/jacoco.xml
            target/surefire-reports/*.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Generar SW Test Plan, TC Design y Test Report
        id: excel
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install openpyxl pyyaml matplotlib pillow
          python tools/extraer_tc.py
          python tools/generar_documentos.py

      - name: Publicar entregables (Excel + diagramas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entregables-qa
          path: entregables/
          if-no-files-found: warn

      - name: Revisar resultados
        run: |
          if grep -lE '<(failure|error)[ >]' target/surefire-reports/TEST-*.xml; then
            echo "::error::Hay pruebas fallidas (ver archivos arriba)"
            exit 1
          fi
